<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 내가 이해한 것 · 과학 피드백</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e1d8; --accent:#2f6f4f; --accent-soft:#e7f1ea; --warn:#b45309; --warn-soft:#fdf2e3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink); line-height:1.6;
         word-break:keep-all; overflow-wrap:break-word; line-break:strict; text-wrap:pretty; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { font-size:18px; margin:0; text-wrap:balance; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .muted { color:var(--muted); font-size:14px; }
  label { display:block; font-weight:500; margin:10px 0 4px; }
  input, textarea, select { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:84px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .pill { display:inline-block; font-size:13px; padding:2px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .feedback { background:var(--accent-soft); border-radius:10px; padding:12px; margin-top:10px; }
  .tabs button { background:#fff; color:var(--ink); border-color:var(--line); }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .emoji button { background:#fff; border-color:var(--line); font-size:20px; padding:4px 10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>🌱 오늘 내가 이해한 것</h1>
  <div class="row tabs">
    <button id="tab-student" class="on">학생</button>
    <button id="tab-teacher">선생님</button>
  </div>
</header>
<main id="app"></main>

<script>
// ===== 설정 =====
// Supabase 주소와 공개(anon) 키. 비어 있으면 브라우저 저장(localStorage)을 쓴다.
// service_role(관리자) 키는 절대 여기에 넣지 않는다.
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
// 선생님 화면 잠금(실습용). 화면 코드에 있으므로 "소스 보기"로 보인다 → 화면 잠금 수준.
const TEACHER_PASSWORD = 'teacher-demo';
// AI 피드백 다듬기 버튼 (api/feedback.js가 배포되어 있어야 동작)
const FEATURE_AI = false;

// ===== 저장소: Supabase 또는 localStorage =====
const db = SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const LS = { a: 'fb_assignments', s: 'fb_submissions' };
const lsGet = (k) => JSON.parse(localStorage.getItem(k) || '[]');
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
const now = () => new Date().toISOString();

const store = {
  async assignments() {
    if (db) { const { data, error } = await db.from('assignments').select('*').order('created_at', { ascending: false }); if (error) throw error; return data; }
    return lsGet(LS.a).sort((x, y) => y.created_at.localeCompare(x.created_at));
  },
  async addAssignment(a) {
    const row = { title: a.title, questions: a.questions, link: a.link || null };
    if (db) { const { error } = await db.from('assignments').insert(row); if (error) throw error; return; }
    lsSet(LS.a, [...lsGet(LS.a), { id: uid(), created_at: now(), ...row }]);
  },
  async submissions() {
    if (db) { const { data, error } = await db.from('submissions').select('*').order('created_at', { ascending: false }); if (error) throw error; return data; }
    return lsGet(LS.s).sort((x, y) => y.created_at.localeCompare(x.created_at));
  },
  async addSubmission(s) {
    if (db) { const { error } = await db.from('submissions').insert(s); if (error) throw error; return; }
    lsSet(LS.s, [...lsGet(LS.s), { id: uid(), created_at: now(), ...s }]);
  },
  async update(id, patch) {
    if (db) { const { error } = await db.from('submissions').update(patch).eq('id', id); if (error) throw error; return; }
    lsSet(LS.s, lsGet(LS.s).map((r) => (r.id === id ? { ...r, ...patch } : r)));
  },
};

// ===== 공통 =====
const $app = document.getElementById('app');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (iso) => (iso ? new Date(iso).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');
const questionsOf = (a) => (a && Array.isArray(a.questions) && a.questions.length ? a.questions : ['오늘 수업에서 내가 이해한 내용을 내 말로 3~5문장 써 보세요.']);
let role = 'student';
let teacherUnlocked = sessionStorage.getItem('teacher_ok') === '1';
let teacherFilter = 'all';

function setRole(r) {
  role = r;
  document.getElementById('tab-student').classList.toggle('on', r === 'student');
  document.getElementById('tab-teacher').classList.toggle('on', r === 'teacher');
  render();
}
document.getElementById('tab-student').onclick = () => setRole('student');
document.getElementById('tab-teacher').onclick = () => setRole('teacher');

async function render() {
  try { role === 'student' ? await renderStudent() : await renderTeacher(); }
  catch (e) { $app.innerHTML = `<div class="card"><b>저장소에 연결하지 못했습니다.</b><p class="muted">${esc(e.message)}</p></div>`; }
}

// ===== 학생 화면 =====
async function renderStudent() {
  const name = localStorage.getItem('student_name') || '';
  const [as, subs] = await Promise.all([store.assignments(), store.submissions()]);
  const mine = subs.filter((s) => name && s.student_name === name);
  const aMap = Object.fromEntries(as.map((a) => [a.id, a]));
  $app.innerHTML = `
    <div class="card">
      <label for="sname">내 이름 (별명도 괜찮아요)</label>
      <div class="row"><input id="sname" value="${esc(name)}" placeholder="예: 하늘" style="flex:1"><button id="save-name" class="ghost">저장</button></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0;font-size:17px">✏️ 과제 제출하기</h2>
      ${as.length ? `<label for="asel">과제</label><select id="asel">${as.map((a) => `<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select>
      <div id="alink"></div><div id="qbox"></div>
      <label for="diff">어려웠던 점 한 줄 (선생님께 살짝)</label><input id="diff" placeholder="예: 전류와 전압이 아직 헷갈려요">
      <div class="row" style="margin-top:12px"><button id="submit">제출하기</button><span id="smsg" class="muted"></span></div>`
      : '<p class="muted">아직 선생님이 올린 과제가 없어요.</p>'}
    </div>
    <h2 style="font-size:17px">💬 내가 받은 피드백</h2>
    ${mine.length ? mine.map((s) => studentItem(s, aMap[s.assignment_id])).join('') : '<p class="muted">이름을 저장하고 제출하면 여기에 모여요.</p>'}`;
  document.getElementById('save-name').onclick = () => { localStorage.setItem('student_name', document.getElementById('sname').value.trim()); render(); };
  if (as.length) {
    const showQs = () => {
      const a = aMap[document.getElementById('asel').value];
      document.getElementById('alink').innerHTML = a.link ? `<p class="muted">참고 자료: <a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.link)}</a></p>` : '';
      document.getElementById('qbox').innerHTML = questionsOf(a).map((q, i) => `<label for="q${i}">${i + 1}. ${esc(q)}</label><textarea id="q${i}"></textarea>`).join('');
    };
    document.getElementById('asel').onchange = showQs; showQs();
    document.getElementById('submit').onclick = async () => {
      const n = document.getElementById('sname').value.trim();
      if (!n) { document.getElementById('smsg').textContent = '이름을 먼저 적어 주세요.'; return; }
      localStorage.setItem('student_name', n);
      const a = aMap[document.getElementById('asel').value];
      const answers = questionsOf(a).map((q, i) => ({ q, a: document.getElementById('q' + i).value.trim() }));
      if (answers.some((x) => !x.a)) { document.getElementById('smsg').textContent = '모든 질문에 답해 주세요.'; return; }
      await store.addSubmission({ assignment_id: a.id, student_name: n, answers, difficulty: document.getElementById('diff').value.trim() });
      render();
    };
  }
  mine.forEach((s) => bindStudentItem(s));
}

function studentItem(s, a) {
  const has = !!s.feedback_at;
  return `<div class="card" id="s-${s.id}">
    <div class="row" style="justify-content:space-between"><b>${esc(a?.title || '과제')}</b><span class="muted">${fmt(s.created_at)}</span></div>
    ${(s.answers || []).map((x) => `<p class="muted" style="margin:6px 0 0">${esc(x.q)}</p><p style="margin:2px 0">${esc(x.a)}</p>`).join('')}
    ${has ? (s.read_at ? `<div class="feedback"><b>👍 잘한 점</b><p style="margin:2px 0 8px">${esc(s.feedback_good)}</p><b>👣 다음 걸음</b><p style="margin:2px 0">${esc(s.feedback_next)}</p></div>
      <div class="row emoji" style="margin-top:8px">${['😊', '💡', '🙏', '🤔'].map((e) => `<button data-e="${e}" ${s.reaction === e ? 'style="border-color:var(--accent)"' : ''}>${e}</button>`).join('')}</div>
      ${s.reply ? `<p class="muted">내 답글: ${esc(s.reply)}</p>` : `<div class="row" style="margin-top:8px"><input id="r-${s.id}" placeholder="선생님께 한 줄 답글" style="flex:1"><button class="ghost" data-reply>보내기</button></div>`}`
      : `<button data-open style="margin-top:10px">📩 선생님 피드백 열어 보기</button>`)
      : '<p class="pill" style="margin-top:10px">선생님이 읽고 있어요</p>'}
  </div>`;
}

function bindStudentItem(s) {
  const el = document.getElementById('s-' + s.id);
  el.querySelector('[data-open]')?.addEventListener('click', async () => { await store.update(s.id, { read_at: now() }); render(); });
  el.querySelectorAll('[data-e]').forEach((b) => b.addEventListener('click', async () => { await store.update(s.id, { reaction: b.dataset.e }); render(); }));
  el.querySelector('[data-reply]')?.addEventListener('click', async () => {
    const v = document.getElementById('r-' + s.id).value.trim(); if (v) { await store.update(s.id, { reply: v }); render(); }
  });
}

// ===== 선생님 화면 =====
async function renderTeacher() {
  if (!teacherUnlocked) {
    $app.innerHTML = `<div class="card"><h2 style="margin-top:0;font-size:17px">🔒 선생님 화면</h2>
      <p class="muted">모든 학생의 글과 피드백이 있는 관리자 화면이라 비밀번호가 필요합니다.</p>
      <label for="pw">관리자 비밀번호</label><div class="row"><input id="pw" type="password" style="flex:1"><button id="unlock">열기</button></div><p id="pwmsg" class="muted"></p></div>`;
    document.getElementById('unlock').onclick = () => {
      if (document.getElementById('pw').value === TEACHER_PASSWORD) { teacherUnlocked = true; sessionStorage.setItem('teacher_ok', '1'); render(); }
      else document.getElementById('pwmsg').textContent = '비밀번호가 맞지 않습니다.';
    };
    return;
  }
  const [as, subs] = await Promise.all([store.assignments(), store.submissions()]);
  const aMap = Object.fromEntries(as.map((a) => [a.id, a]));
  const unread = subs.filter((s) => s.feedback_at && !s.read_at);
  const replied = subs.filter((s) => s.reply);
  const waiting = subs.filter((s) => !s.feedback_at);
  const list = { all: subs, waiting, unread, replied }[teacherFilter];
  $app.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0;font-size:17px">📌 과제 올리기</h2>
      <label for="at">제목</label><input id="at" placeholder="예: 전기와 자기 1차시 - 오늘 내가 이해한 것">
      ${[0, 1, 2].map((i) => `<label for="aq${i}">질문 ${i + 1}${i ? ' (선택)' : ''}</label><input id="aq${i}">`).join('')}
      <label for="al">참고 링크 (선택)</label><input id="al" placeholder="예: https://내주소/deck/my-deck.html">
      <div class="row" style="margin-top:12px"><button id="addA">올리기</button><span class="muted">질문을 비우면 "내가 이해한 내용 쓰기" 한 칸이 나옵니다.</span></div>
    </div>
    <div class="row tabs" style="margin-bottom:12px">
      ${[['all', `전체 ${subs.length}`], ['waiting', `피드백 전 ${waiting.length}`], ['unread', `안 읽음 ${unread.length}`], ['replied', `답글 옴 ${replied.length}`]]
        .map(([k, t]) => `<button data-f="${k}" class="${teacherFilter === k ? 'on' : ''}">${t}</button>`).join('')}
    </div>
    ${list.length ? list.map((s) => teacherItem(s, aMap[s.assignment_id])).join('') : '<p class="muted">해당하는 제출물이 없습니다.</p>'}`;
  document.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { teacherFilter = b.dataset.f; render(); }));
  document.getElementById('addA').onclick = async () => {
    const title = document.getElementById('at').value.trim(); if (!title) return;
    const questions = [0, 1, 2].map((i) => document.getElementById('aq' + i).value.trim()).filter(Boolean);
    await store.addAssignment({ title, questions, link: document.getElementById('al').value.trim() });
    render();
  };
  list.forEach((s) => bindTeacherItem(s));
}

function teacherItem(s, a) {
  const status = !s.feedback_at ? '<span class="pill warn">피드백 전</span>'
    : s.read_at ? `<span class="pill">읽음 ${fmt(s.read_at)}</span>` : '<span class="pill warn">아직 안 읽음</span>';
  return `<div class="card" id="t-${s.id}">
    <div class="row" style="justify-content:space-between"><b>${esc(s.student_name)} · ${esc(a?.title || '과제')}</b>${status}</div>
    ${(s.answers || []).map((x) => `<p class="muted" style="margin:6px 0 0">${esc(x.q)}</p><p style="margin:2px 0">${esc(x.a)}</p>`).join('')}
    ${s.difficulty ? `<p class="muted">어려웠던 점: ${esc(s.difficulty)}</p>` : ''}
    ${s.reaction || s.reply ? `<p>학생 반응: ${esc(s.reaction || '')} ${esc(s.reply || '')}</p>` : ''}
    <label>👍 잘한 점</label><textarea data-good>${esc(s.feedback_good || '')}</textarea>
    <label>👣 다음 걸음</label><textarea data-next>${esc(s.feedback_next || '')}</textarea>
    <div class="row" style="margin-top:8px">
      ${FEATURE_AI ? '<button class="ghost" data-ai>✨ AI로 다듬기</button>' : ''}
      <button data-save>${s.feedback_at ? '수정해서 다시 보내기' : '확정해서 보내기'}</button>
      <span class="muted" data-msg></span>
    </div>
  </div>`;
}

function bindTeacherItem(s) {
  const el = document.getElementById('t-' + s.id);
  const good = el.querySelector('[data-good]'), next = el.querySelector('[data-next]'), msg = el.querySelector('[data-msg]');
  el.querySelector('[data-save]').onclick = async () => {
    if (!good.value.trim() || !next.value.trim()) { msg.textContent = '잘한 점과 다음 걸음을 모두 적어 주세요.'; return; }
    await store.update(s.id, { feedback_good: good.value.trim(), feedback_next: next.value.trim(), feedback_at: now(), read_at: null });
    render();
  };
  el.querySelector('[data-ai]')?.addEventListener('click', async (ev) => {
    ev.target.disabled = true; msg.textContent = 'AI가 피드백을 다듬는 중...';
    try {
      const r = await fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: s.answers, difficulty: s.difficulty, memo_good: good.value, memo_next: next.value }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
      good.value = j.good; next.value = j.next; msg.textContent = 'AI가 다듬은 피드백입니다. 과학 내용이 맞는지 확인하고 고친 뒤 보내세요.';
    } catch (e) { console.error('AI 다듬기 실패:', e); msg.textContent = 'AI 다듬기를 쓸 수 없습니다. 직접 써 주세요.'; }
    ev.target.disabled = false;
  });
}

render();
</script>
</body>
</html>
